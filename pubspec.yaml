name: fishsense_android
description: FishSense Android app for fish length measurement and species classification
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Persistent key-value store (onboarding flag, user prefs)
  shared_preferences: ^2.3.0

  # Camera (start with basic camera, add ARCore later)
  # camera: ^0.10.5
  permission_handler: ^13.0.2

  # Location (GPS fix for photo capture)
  geolocator: ^14.1.1

  # Reverse geocoding (lat/lon → human-readable place name)
  geocoding: ^5.0.0

  # Map view for the catches map screen (OpenStreetMap tiles, no API key)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Image & File handling
  image: ^4.1.3
  
  # HTTP & Cloud sync
  http: ^1.1.0
  
  # FFI for Rust integration
  ffi: ^2.1.0
  
  # State management
  provider: ^6.1.1
  
  # Utilities
  archive: ^4.0.9

  vector_math: ^2.1.4

  # Logging
  logger: ^2.4.0

  # Capture provenance: capture/measurement UUIDs, app version, and a
  # per-install ID kept in the Keychain
  uuid: ^4.6.0
  package_info_plus: ^10.2.2
  flutter_secure_storage: ^11.2.0

  # Optional Authentik sign-in (OIDC + PKCE), needed only to sync
  flutter_appauth: ^12.1.0

  # Sync: uploads through a background URLSession, and the SHA-256 each
  # presigned upload is signed with
  background_downloader: ^9.6.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Runs the real SQLite migrations on the host in tests
  sqflite_common_ffi: ^2.4.4
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  
