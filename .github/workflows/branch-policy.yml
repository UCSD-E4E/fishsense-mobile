name: Branch Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, staging, develop]

permissions:
  pull-requests: read

jobs:
  # Versions move develop -> staging -> main. hotfix/* may go straight into
  # staging when develop has already moved on to the next version.
  source-branch:
    runs-on: ubuntu-latest
    steps:
    - name: 🚦 Check source branch
      env:
        BASE: ${{ github.base_ref }}
        HEAD: ${{ github.head_ref }}
      run: |
        case "$BASE:$HEAD" in
          staging:develop|staging:hotfix/*|main:staging) echo "OK: $HEAD -> $BASE" ;;
          staging:*) echo "::error::PRs into staging must come from develop or hotfix/* (got $HEAD)"; exit 1 ;;
          main:*) echo "::error::PRs into main must come from staging (got $HEAD)"; exit 1 ;;
          *) exit 0 ;;
        esac

  # PRs into develop are squash-merged, so the PR title becomes the commit
  # release-please reads.
  pr-title:
    runs-on: ubuntu-latest
    steps:
    - uses: amannn/action-semantic-pull-request@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
