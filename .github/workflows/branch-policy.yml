name: Branch Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, develop]

permissions:
  pull-requests: read

jobs:
  # Only develop (a promotion), hotfix/* and release-please's own branch may
  # merge into main.
  source-branch:
    runs-on: ubuntu-latest
    steps:
    - name: 🚦 Check source branch
      env:
        BASE: ${{ github.base_ref }}
        HEAD: ${{ github.head_ref }}
      run: |
        if [ "$BASE" != main ]; then exit 0; fi
        case "$HEAD" in
          develop|hotfix/*|release-please--*) echo "OK: $HEAD -> main" ;;
          *) echo "::error::PRs into main must come from develop or hotfix/* (got $HEAD)"; exit 1 ;;
        esac

  # PRs into develop are squash-merged, so the PR title becomes the commit
  # release-please reads.
  pr-title:
    runs-on: ubuntu-latest
    steps:
    - uses: amannn/action-semantic-pull-request@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
