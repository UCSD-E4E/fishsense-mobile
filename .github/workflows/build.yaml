name: Build

on: [push]

# Branching model (see CONTRIBUTING.md):
#   develop  -> every push uploads to TestFlight for internal testers
#   main     -> release-please keeps a release PR open; merging it tags vX.Y.Z,
#               publishes a GitHub Release, and ships that build to the external
#               TestFlight group(s). A sync PR then brings main back into develop.
jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
    - id: release
      uses: googleapis/release-please-action@v5
      with:
        # PRs opened with GITHUB_TOKEN don't trigger workflows, so required
        # checks never report on them. A PAT/App token avoids that.
        token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
        # Without this release-please targets the repo's default branch
        # (develop), so the release PR lands there and never tags or ships.
        target-branch: main

  sync-develop:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: 🔁 Open main -> develop sync PR
      env:
        GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release-please.outputs.tag_name }}
      run: |
        gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
          --title "chore: sync main into develop after $TAG" \
          --body "Brings the $TAG version bump and changelog back into develop. Merge with a merge commit."

  build:
    needs: release-please
    # release-please is skipped off main; still build everywhere else.
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      # internal: develop pushes. external: the push to main that created a release.
      DEPLOY: ${{ github.ref == 'refs/heads/develop' && 'internal' || (needs.release-please.outputs.release_created == 'true' && 'external' || '') }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      TESTFLIGHT_EXTERNAL_GROUPS: ${{ vars.TESTFLIGHT_EXTERNAL_GROUPS }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 🛠️ Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: 🦋 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: 📦 Cache Flutter pub packages
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: 📥 Get dependencies
      run: flutter pub get

    - name: 🔍 Flutter analyze
      run: flutter analyze --no-fatal-infos

    - name: 🧪 Run Flutter tests
      run: flutter test

    - name: 📦 Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust-bridge/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust-bridge/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: 🧱 Build Dependencies
      run: |
        python -m pip install --upgrade pip uv
        cd rust-bridge
        make

    - name: 🔍 Rust lint (clippy)
      run: |
        brew install opencv
        cd rust-bridge
        cargo clippy -- -D warnings

    - name: 🧪 Run Rust tests
      run: |
        cd rust-bridge
        cargo test --features download-binaries

    - name: 🔍 Swift lint (SwiftLint)
      run: |
        brew install swiftlint
        swiftlint lint --strict ios/Runner

    - name: 📱 Configure iOS App
      run: |
        if [ -z "${FASTLANE_TEAM_ID}" ]; then
          echo "FASTLANE_TEAM_ID is not set. Building iOS without signing-only settings."
        fi
        BUNDLE_IDENTIFIER="${APP_IDENTIFIER:-com.aqua3d.fishsense}"
        echo "PERSONAL_DEVELOPMENT_TEAM = ${FASTLANE_TEAM_ID}" > ios/Flutter/DeveloperSettings.xcconfig
        echo "FISHSENSE_BUNDLE_IDENTIFIER = ${BUNDLE_IDENTIFIER}" >> ios/Flutter/DeveloperSettings.xcconfig

    - name: 📦 Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: ios/Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: 📦 Install CocoaPods
      run: |
        cd ios
        pod install

    - name: 📦 Cache Ruby Gems
      uses: actions/cache@v4
      with:
        path: ios/vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('ios/Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-

    - name: ⚙️ Configure Bundler
      run: |
        cd ios
        bundle config set --local path vendor/bundle

    - name: 🔑 Prepare SSH Key for Fastlane Match
      if: ${{ env.DEPLOY != '' }}
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.MATCH_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
    - name: 🔑 Sync Code Signing
      if: ${{ env.DEPLOY != '' }}
      run: |
        cd ios
        bundle install
        bundle exec fastlane sync_code_signing

    - name: 📦 Cache Xcode DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-derived-data-${{ hashFiles('ios/Podfile.lock', 'pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-xcode-derived-data-

    - name: 🧪 Run Swift unit tests
      run: |
        xcodebuild test \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
          -only-testing RunnerTests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: 🏗️ Build Flutter iOS
      run: flutter build ios --release --no-codesign

    - name: 🔢 Increment iOS Build Number
      if: ${{ env.DEPLOY != '' }}
      run: |
        cd ios
        bundle install
        bundle exec fastlane run increment_build_number build_number:${{ github.run_number }}

    - name: 🚀 Publish to TestFlight
      if: ${{ env.DEPLOY != '' }}
      run: |
        if [ -z "${FASTLANE_TEAM_ID}" ]; then
          echo "FASTLANE_TEAM_ID is required for TestFlight upload."
          exit 1
        fi
        cd ios
        bundle install
        if [ "$DEPLOY" = external ]; then
          RELEASE_NOTES="$(gh release view "$RELEASE_TAG" --json body -q .body)"
          export RELEASE_NOTES
          bundle exec fastlane release
        else
          bundle exec fastlane beta
        fi
      env:
        GH_TOKEN: ${{ github.token }}
