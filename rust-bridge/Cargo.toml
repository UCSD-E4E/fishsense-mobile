[package]
name = "rust-bridge"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Opt-in for host builds (e.g. `cargo test` on macOS): lets ort-sys download a
# prebuilt ONNX Runtime so the test binary can link. iOS builds intentionally
# omit this and link the xcframework shipped with the app.
download-binaries = ["fishsense-core/download-binaries"]

[dependencies]
# v2.1.5 replaced OpenCV with pure-Rust image/imageproc (PR #50), dropping the
# last non-Rust build dependency. v2.1.6 ranks single-instance detections by
# score x area instead of area alone (PR #51), which `inference_single` relies on.
# v4.1.0 verifies the embedded model against a pinned manifest (PR #84); the
# 3.0/4.0 breaking changes are Python-side and don't touch this crate's API.
fishsense-core = { git = "https://github.com/UCSD-E4E/fishsense-core", tag = "fishsense_core-v4.1.0", default-features = false, features = ["coreml"] }
libc = "0.2.184"
ndarray = "0.17.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Apple's unified log; see init_tracing. Other targets log to stderr.
[target.'cfg(target_vendor = "apple")'.dependencies]
tracing-oslog = "0.3"

[lib]
name = "fishsense_bridge"
crate-type = ["staticlib"]

# Xcode 27's /usr/bin/strip leaves host proc-macro dylibs with a mis-aligned
# LINKEDIT that rustc then fails to dlopen ("can't find crate for
# `zerofrom_derive`"). Skip stripping for host build helpers only; the iOS
# static libraries are unaffected.
[profile.release.build-override]
strip = false
